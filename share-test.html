
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Longshots Share Test</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f1f4f2;
      padding: 25px;
      text-align: center;
    }

    main {
      max-width: 420px;
      margin: 30px auto;
      padding: 25px;
      background: white;
      border-radius: 15px;
    }

    button {
      width: 100%;
      padding: 16px;
      margin-top: 20px;
      background: #176b45;
      color: white;
      border: 0;
      border-radius: 8px;
      font-size: 17px;
      font-weight: bold;
    }

    #status {
      margin-top: 20px;
      white-space: pre-wrap;
      overflow-wrap: anywhere;
    }
  </style>
</head>
<body>
  <main>
    <h2>Longshots Share Test</h2>
    <p>This creates a test PNG and shares it to another app.</p>
    <button id="share">Create and Share Test Image</button>
    <div id="status">Ready.</div>
  </main>

  <script>
    const statusBox = document.getElementById("status");

    document.getElementById("share").addEventListener("click", async () => {
      try {
        statusBox.textContent = "Creating test image...";

        const canvas = document.createElement("canvas");
        canvas.width = 600;
        canvas.height = 400;

        const ctx = canvas.getContext("2d");

        ctx.fillStyle = "#176b45";
        ctx.fillRect(0, 0, 600, 400);

        ctx.fillStyle = "#ffffff";
        ctx.font = "bold 42px Arial";
        ctx.textAlign = "center";
        ctx.fillText("LONGSHOTS TEST", 300, 190);

        ctx.font = "26px Arial";
        ctx.fillText("Share image test", 300, 245);

        const blob = await new Promise((resolve, reject) => {
          canvas.toBlob(result => {
            if (result) resolve(result);
            else reject(new Error("PNG creation failed"));
          }, "image/png");
        });

        const file = new File(
          [blob],
          "longshots-share-test.png",
          { type: "image/png" }
        );

        statusBox.textContent =
          "PNG created successfully.\n" +
          "File size: " + file.size + " bytes\n" +
          "Share support: " +
          (navigator.canShare?.({ files: [file] }) ? "Yes" : "No");

        if (!navigator.canShare?.({ files: [file] })) {
          throw new Error("This browser cannot share this image file.");
        }

        await navigator.share({
          files: [file],
          title: "Longshots Share Test",
          text: "Testing image sharing"
        });

        statusBox.textContent += "\n\nShare completed.";

      } catch (error) {
        statusBox.textContent +=
          "\n\nERROR: " + error.name + "\n" + error.message;
      }
    });
  </script>
</body>
</html>
