
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Longshots Share Test</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      padding: 25px;
      background: #f1f4f2;
      color: #17231c;
    }

    button {
      width: 100%;
      padding: 16px;
      margin-top: 20px;
      background: #176b45;
      color: white;
      border: 0;
      border-radius: 8px;
      font-size: 17px;
      font-weight: bold;
    }

    #status {
      margin-top: 20px;
      white-space: pre-wrap;
      overflow-wrap: anywhere;
    }
  </style>
</head>
<body>

  <h2>Longshots Share Test</h2>

  <p>This creates a test PNG and shares it to another app.</p>

  <button id="share">Create and Share Test Image</button>

  <div id="status">Ready.</div>

  <script>
    const statusBox = document.getElementById("status");

    function showStatus(message) {
      statusBox.textContent = message;
    }

    document.getElementById("share").addEventListener("click", async () => {
      try {
        showStatus("Creating test image...");

        const canvas = document.createElement("canvas");
        canvas.width = 600;
        canvas.height = 300;

        const context = canvas.getContext("2d");

        context.fillStyle = "#176b45";
        context.fillRect(0, 0, 600, 300);

        context.fillStyle = "#ffffff";
        context.font = "bold 42px Arial";
        context.fillText("LONGSHOTS TEST", 70, 135);

        context.font = "26px Arial";
        context.fillText("Share API image", 70, 190);

        const blob = await new Promise((resolve, reject) => {
          canvas.toBlob(result => {
            if (result) resolve(result);
            else reject(new Error("PNG creation failed"));
          }, "image/png");
        });

        const file = new File(
          [blob],
          "longshots-share-test.png",
          { type: "image/png" }
        );

        const supported =
          navigator.canShare &&
          navigator.canShare({ files: [file] });

        if (!supported) {
          showStatus("This browser cannot share the test image as a file.");
          return;
        }

        showStatus(
          "PNG created successfully.\n" +
          "File size: " + file.size + " bytes\n" +
          "Opening Android share menu..."
        );

        await navigator.share({
          files: [file],
          title: "Longshots Share Test",
          text: "Testing image sharing"
        });

        showStatus("Share completed.");

      } catch (error) {
        showStatus(
          error.name + ": " + error.message
        );
      }
    });
  </script>

</body>
</html>
